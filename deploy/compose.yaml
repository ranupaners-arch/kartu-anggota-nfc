# Kartu Anggota — stack produksi. Dua cara jalan (lihat docs/deploy.md):
#   1) Dari image GHCR (tanpa build di server, dibangun workflow "Image (GHCR)"):
#        folder berisi compose.yaml + backup.sh + .env  →  docker compose pull && docker compose up -d --no-build
#   2) Build sendiri dari source (folder deploy/ di repo):
#        cp .env.example .env   (lalu isi)   →   docker compose up -d --build
name: kartu-anggota

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: app
  image: ${APP_IMAGE:-ghcr.io/ranupaners-arch/kartu-anggota-app:latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_started

services:
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      CACHE_CONFIG: "1"
    # Database, cache, penyimpanan, detak queue worker & scheduler (lihat app:health).
    healthcheck:
      test: ["CMD", "php", "artisan", "app:health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
      start_interval: 5s

  worker:
    <<: *app
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: ${WEB_IMAGE:-ghcr.io/ranupaners-arch/kartu-anggota-web:latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?isi SITE_ADDRESS di .env}
      # Proxy di depan Caddy yang header X-Forwarded-*-nya dipercaya (mis. private_ranges bila di
      # belakang Nginx host). Bawaan: tidak ada proxy (Caddy langsung melayani internet).
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?isi DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?isi DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey:/data

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${BACKUP_TZ:-Asia/Jakarta}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/storage
    depends_on:
      db:
        condition: service_healthy

  # Salinan backup terenkripsi ke S3. Aktif bila COMPOSE_PROFILES=offsite di .env.
  offsite:
    image: rclone/rclone:1
    profiles: [offsite]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/offsite.sh"]
    environment:
      OFFSITE_BUCKET: ${OFFSITE_BUCKET:-}
      OFFSITE_ENDPOINT: ${OFFSITE_ENDPOINT:-}
      OFFSITE_REGION: ${OFFSITE_REGION:-auto}
      OFFSITE_ACCESS_KEY: ${OFFSITE_ACCESS_KEY:-}
      OFFSITE_SECRET_KEY: ${OFFSITE_SECRET_KEY:-}
      OFFSITE_PASSWORD: ${OFFSITE_PASSWORD:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-90}
      OFFSITE_PING_URL: ${OFFSITE_PING_URL:-}
      TZ: ${BACKUP_TZ:-Asia/Jakarta}
    volumes:
      - ./offsite.sh:/offsite.sh:ro
      - ./backups:/backups

volumes:
  storage:
  pgdata:
  valkey:
  caddy_data:
  caddy_config:
