# Kartu Anggota — stack produksi. Jalankan dari folder deploy/:
#   cp .env.example .env   (lalu isi)   →   docker compose up -d --build
name: kartu-anggota

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: app
  image: kartu-anggota-app
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
    cache:
      condition: service_started

services:
  app:
    <<: *app
    environment:
      RUN_MIGRATIONS: "1"
      CACHE_CONFIG: "1"

  worker:
    <<: *app
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: kartu-anggota-web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?isi SITE_ADDRESS di .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?isi DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME:?isi DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey:/data

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      TZ: ${BACKUP_TZ:-Asia/Jakarta}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  storage:
  pgdata:
  valkey:
  caddy_data:
  caddy_config:
