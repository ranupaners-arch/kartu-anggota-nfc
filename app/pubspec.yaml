name: kartuanggota
description: "Aplikasi petugas dan anggota untuk sistem Kartu Anggota NFC."
publish_to: 'none'

# Penanda pengembangan; CI menambahkan nomor run pada versi dan nomor build.
version: 1.0.0-dev+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  nfc_manager: ^4.4.0
  crypto: ^3.0.8
  http: ^1.6.0
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.5.6
  shadcn_ui: ^0.59.0
  audioplayers: ^6.8.1
  qr_flutter: ^4.1.0
  file_picker: ^13.4.0
  app_links: ^7.2.2
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Font ikon Material tetap diperlukan widget bawaan (tombol kembali, halaman lisensi).
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/brand/
