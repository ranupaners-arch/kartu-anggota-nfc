# Aturan lint: rekomendasi Flutter (package:flutter_lints).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**

linter:
  rules:

# Lebar baris mengikuti gaya kode yang sudah ada; `dart format` memakai aturan ini.
formatter:
  page_width: 200
  trailing_commas: preserve
