name: Backend (Laravel)

# Hanya di pull request (tidak diulang setelah merge ke main: isinya sama dengan yang sudah lulus di PR).
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

# Hemat menit Actions: push baru di PR yang sama membatalkan run yang masih berjalan.
# Token GitHub hanya boleh membaca isi repo (tidak ada job yang menulis ke repo).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hmps
          POSTGRES_PASSWORD: hmps_dev
          POSTGRES_DB: hmps_nfc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hmps"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: hmps
      DB_PASSWORD: hmps_dev
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, gd, bcmath, sodium
          coverage: none

      - uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # Dashboard & portal (React): tipe dan build, supaya galat tidak baru ketahuan setelah merge.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
