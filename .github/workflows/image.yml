name: Image (GHCR)

# Bangun image produksi (deploy/Dockerfile target app & web) di runner GitHub lalu push ke GHCR,
# supaya server produksi cukup `docker compose pull` tanpa build di VPS.
# Urutan: uji stack → image bertag SHA → deploy SHA (bila secret VPS_* diisi) → tag latest.
# Di luar main hanya sampai image bertag SHA.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/**', '.dockerignore', '.github/workflows/image.yml', '.github/workflows/deploy.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # deploy & migrasi tidak boleh terpotong

env:
  APP_IMAGE: ghcr.io/ranupaners-arch/kartu-anggota-app
  WEB_IMAGE: ghcr.io/ranupaners-arch/kartu-anggota-web

jobs:
  uji:
    uses: ./.github/workflows/deploy.yml

  build:
    needs: uji
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app (PHP-FPM)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Build & push web (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Cek secret VPS
        id: ready
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Secret VPS_* belum diisi: deploy manual di server (lihat docs/deploy.md).'
          fi

      # Host key wajib dari secret VPS_KNOWN_HOSTS (tanpa ssh-keyscan).
      - name: Siapkan SSH
        if: steps.ready.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Pasang versi ini di VPS
        if: steps.ready.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          opts=(-i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes)
          scp "${opts[@]}" -P "${VPS_PORT:-22}" deploy/rilis.sh "$VPS_USER@$VPS_HOST:/srv/kartu-anggota/rilis.sh"
          scp "${opts[@]}" -P "${VPS_PORT:-22}" deploy/compose.yaml "$VPS_USER@$VPS_HOST:/srv/kartu-anggota/compose.yaml.baru"
          scp "${opts[@]}" -P "${VPS_PORT:-22}" deploy/backup.sh "$VPS_USER@$VPS_HOST:/srv/kartu-anggota/backup.sh.baru"
          scp "${opts[@]}" -P "${VPS_PORT:-22}" deploy/offsite.sh "$VPS_USER@$VPS_HOST:/srv/kartu-anggota/offsite.sh.baru"
          ssh "${opts[@]}" -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "sh /srv/kartu-anggota/rilis.sh $GITHUB_SHA"

  # latest hanya menunjuk versi yang lulus uji (dan berhasil dipasang, bila VPS diatur).
  latest:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          for image in "$APP_IMAGE" "$WEB_IMAGE"; do
            docker buildx imagetools create -t "$image:latest" "$image:$GITHUB_SHA"
          done
