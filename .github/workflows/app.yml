name: App (Flutter)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Debug: untuk uji di HP (boleh HTTP ke server lokal).
      - run: flutter build apk --debug
      # Release memakai signing debug bawaan template sampai keystore rilis disiapkan.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kartuanggota-apk-${{ github.sha }}
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
