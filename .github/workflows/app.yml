name: App (Flutter)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Runner bawaan hanya punya ~14 GB kosong; build Android + cache Flutter bisa
      # memenuhinya sehingga penyimpanan cache gagal ("tar ... Wrote only N bytes").
      - name: Bebaskan ruang disk
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Satu APK uji: build profile (dikompilasi seperti release, kecil & cepat, boleh HTTP
      # ke server uji) khusus arm64. Build release ditambahkan lagi saat siap rilis.
      - name: Build APK pengembangan (arm64)
        id: apk
        run: |
          app_version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          build_name="${app_version%%+*}.${GITHUB_RUN_NUMBER}"
          flutter build apk --profile --target-platform android-arm64 \
            --build-name "$build_name" --build-number "$GITHUB_RUN_NUMBER"
          apk_name="kartu-anggota-${build_name}-arm64.apk"
          mv build/app/outputs/flutter-apk/app-profile.apk "build/app/outputs/flutter-apk/$apk_name"
          printf 'build_name=%s\napk_name=%s\n' "$build_name" "$apk_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: kartuanggota-${{ steps.apk.outputs.build_name }}-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/${{ steps.apk.outputs.apk_name }}
          retention-days: 14

      # Hapus hasil build agar langkah simpan cache (post-job) punya ruang disk.
      - name: Bersihkan hasil build
        if: always()
        run: |
          rm -rf build android/.gradle android/app/build
          df -h /
