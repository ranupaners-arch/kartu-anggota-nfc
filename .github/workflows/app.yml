name: App (Flutter)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Runner bawaan hanya punya ~14 GB kosong; build Android + cache Flutter bisa
      # memenuhinya sehingga penyimpanan cache gagal ("tar ... Wrote only N bytes").
      - name: Bebaskan ruang disk
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Satu APK uji: build profile (dikompilasi seperti release, kecil & cepat, boleh HTTP
      # ke server uji) khusus arm64. Build release ditambahkan lagi saat siap rilis.
      - run: flutter build apk --profile --target-platform android-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: kartuanggota-uji-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-profile.apk
          retention-days: 14

      # Hapus hasil build agar langkah simpan cache (post-job) punya ruang disk.
      - name: Bersihkan hasil build
        if: always()
        run: |
          rm -rf build android/.gradle android/app/build
          df -h /
