<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t">
  <title id="t">Kartu Anggota</title>
  <!-- Latar: kotak membulat indigo -->
  <rect width="512" height="512" rx="112" fill="#4F46E5"/>
  <!-- Kartu anggota, sedikit miring -->
  <g transform="rotate(-8 256 270)">
    <rect x="92" y="150" width="300" height="200" rx="28" fill="#FFFFFF"/>
    <!-- foto & baris data -->
    <rect x="120" y="186" width="64" height="76" rx="12" fill="#C7D2FE"/>
    <circle cx="152" cy="212" r="15" fill="#818CF8"/>
    <path d="M128 256 q24 -30 48 0 z" fill="#818CF8"/>
    <rect x="200" y="194" width="120" height="16" rx="8" fill="#C7D2FE"/>
    <rect x="200" y="224" width="84" height="14" rx="7" fill="#E0E7FF"/>
    <!-- chip -->
    <rect x="120" y="288" width="52" height="38" rx="8" fill="#A5B4FC"/>
  </g>
  <!-- Gelombang NFC -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="22">
    <path d="M398 112 a62 62 0 0 1 0 88"/>
    <path d="M432 80 a104 104 0 0 1 0 150" opacity=".75"/>
  </g>
  <!-- Centang hadir -->
  <circle cx="356" cy="366" r="70" fill="#22C55E" stroke="#4F46E5" stroke-width="14"/>
  <path d="M322 368 l24 24 l46 -50" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
